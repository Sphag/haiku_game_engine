# CI for the open-world engine (US-004).
#
# CPU jobs run on every push and pull request. GPU jobs are separate and run only on
# self-hosted runners with a real GPU (see gpu.yml). Each job uploads CTest JUnit reports
# under the reports artifact so a failing or missing platform is visible per job.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Verified CMake and Ninja versions (docs/build.md). Installed with pip so every runner
  # uses the same build tools instead of whatever image it ships with.
  CMAKE_PIP_VERSION: "3.31.6"
  NINJA_PIP_VERSION: "1.11.1.3"

jobs:
  windows-msvc:
    name: Windows / MSVC (win-dev)
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CMake and Ninja
        run: python -m pip install "cmake==$env:CMAKE_PIP_VERSION" "ninja==$env:NINJA_PIP_VERSION"
      - name: Enter MSVC x64 developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Validate vendored sources
        run: cmake -P cmake/ValidateVendor.cmake
      - name: Configure
        run: cmake --preset win-dev
      - name: Build
        run: cmake --build --preset win-debug
      - name: Unit and integration tests
        run: |
          New-Item -ItemType Directory -Force artifacts/reports | Out-Null
          ctest --preset win-unit --output-on-failure --no-tests=error --output-junit "$env:GITHUB_WORKSPACE/artifacts/reports/win-msvc-unit.xml"
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-windows-msvc
          path: artifacts/reports/
          if-no-files-found: warn

  linux-clang:
    name: Linux / Clang (linux-dev)
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-14 libc6-dev
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-14 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-14 100
          python3 -m pip install "cmake==$CMAKE_PIP_VERSION" "ninja==$NINJA_PIP_VERSION"
          clang --version
      - name: Validate vendored sources
        run: cmake -P cmake/ValidateVendor.cmake
      - name: Configure
        run: cmake --preset linux-dev
      - name: Build
        run: cmake --build --preset linux-debug
      - name: Unit and integration tests
        run: |
          mkdir -p artifacts/reports
          ctest --preset linux-unit --output-on-failure --no-tests=error --output-junit "$GITHUB_WORKSPACE/artifacts/reports/linux-clang-unit.xml"
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-linux-clang
          path: artifacts/reports/
          if-no-files-found: warn

  linux-gcc:
    name: Linux / GCC (linux-gcc)
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-11 g++-11 libc6-dev
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-11 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-11 100
          python3 -m pip install "cmake==$CMAKE_PIP_VERSION" "ninja==$NINJA_PIP_VERSION"
          gcc --version
      - name: Validate vendored sources
        run: cmake -P cmake/ValidateVendor.cmake
      - name: Configure
        run: cmake --preset linux-gcc
      - name: Build
        run: cmake --build --preset linux-gcc-debug
      - name: Unit and integration tests
        run: |
          mkdir -p artifacts/reports
          ctest --preset linux-gcc-unit --output-on-failure --no-tests=error --output-junit "$GITHUB_WORKSPACE/artifacts/reports/linux-gcc-unit.xml"
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-linux-gcc
          path: artifacts/reports/
          if-no-files-found: warn

  linux-sanitize:
    name: Linux / CPU sanitizers (linux-asan)
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-14 libc6-dev
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-14 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-14 100
          python3 -m pip install "cmake==$CMAKE_PIP_VERSION" "ninja==$NINJA_PIP_VERSION"
      - name: Validate vendored sources
        run: cmake -P cmake/ValidateVendor.cmake
      - name: Configure
        run: cmake --preset linux-asan
      - name: Build
        run: cmake --build --preset linux-asan
      - name: Sanitizer tests
        run: |
          mkdir -p artifacts/reports
          ctest --preset linux-sanitize --output-on-failure --no-tests=error --output-junit "$GITHUB_WORKSPACE/artifacts/reports/linux-asan-ubsan.xml"
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-linux-sanitize
          path: artifacts/reports/
          if-no-files-found: warn

  offline-build:
    name: Offline build (no network, empty build directory)
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-14 libc6-dev
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-14 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-14 100
          python3 -m pip install "cmake==$CMAKE_PIP_VERSION" "ninja==$NINJA_PIP_VERSION"
      - name: Configure, build, and test without network
        run: bash tools/ci/offline_verify.sh
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-offline
          path: artifacts/reports/
          if-no-files-found: warn

  gpu-status:
    # Always runs. It records the status of every GPU environment, so a missing GPU runner
    # appears as not-run in the report instead of silently disappearing.
    name: GPU environment status
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Record GPU environment status
        env:
          GPU_RUNNER_ENABLED: ${{ vars.GPU_RUNNER_ENABLED }}
        run: |
          mkdir -p artifacts/reports
          for env in windows-dx12 windows-vulkan linux-vulkan; do
            if [ "$GPU_RUNNER_ENABLED" = "true" ]; then
              echo "GPU runner registered; see the gpu-$env job for its result"
            else
              python3 -I tools/ci/write_status.py --out "artifacts/reports/gpu-$env.json" \
                --environment "$env" --status not-run \
                --reason "no GPU runner registered (repository variable GPU_RUNNER_ENABLED is not true)"
            fi
          done
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: reports-gpu-status
          path: artifacts/reports/
          if-no-files-found: warn
